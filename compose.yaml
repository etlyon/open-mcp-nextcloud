name: open-mcp-nextcloud

services:
  connector:
    build:
      context: .
    image: open-mcp-nextcloud:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:8000"
    volumes:
      - type: bind
        source: ./connector.toml
        target: /config/connector.toml
        read_only: true
      - connector-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  connector-data:
